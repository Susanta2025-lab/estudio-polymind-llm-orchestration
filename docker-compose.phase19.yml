# Dedicated production foundation. External execution and Chat remain blocked.
x-app: &app
  image: ${PHASE19_APP_IMAGE:?Set the reviewed application image}
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=128m,uid=10001,gid=10001,mode=0700"]
  environment: &environment
    PYTHONPATH: /app
    PYTHONDONTWRITEBYTECODE: "1"
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    OMP_NUM_THREADS: "1"
    TOKENIZERS_PARALLELISM: "false"
  restart: "on-failure:3"
  stop_grace_period: 90s
  logging: &logging
    driver: json-file
    options: {max-size: "5m", max-file: "3"}

services:
  api:
    <<: *app
    working_dir: /state
    command: [python, -m, deployment.phase19, serve, /state]
    volumes:
      - type: bind
        source: ${PHASE19_STATE_ROOT:?Prepare stable private state mount}
        target: /state
        bind: {create_host_path: false}
      - type: bind
        source: ${PHASE19_PROVIDER_SECRET:?Supply a private provider secret file}
        target: /run/secrets/provider
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PHASE19_EXECUTION_AUTHORITY:?Supply independently managed execution trust and permissions}
        target: /run/secrets/execution-authority
        read_only: true
        bind: {create_host_path: false}
    networks: [backend, egress]
    mem_limit: 3g
    cpus: 1.5
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6
    depends_on:
      redis: {condition: service_healthy}
      chroma: {condition: service_healthy}

  ui:
    <<: *app
    working_dir: /tmp
    command: [python, -m, streamlit, run, /app/deployment/phase19/ui.py, --server.address=0.0.0.0,
              --server.port=8501, --server.headless=true, --browser.gatherUsageStats=false,
              --server.fileWatcherType=none]
    volumes:
      - type: bind
        source: ${PHASE19_STREAMLIT_SECRET:?Supply external OIDC Streamlit secrets}
        target: /tmp/.streamlit/secrets.toml
        read_only: true
        bind: {create_host_path: false}
    networks: [backend, frontend, egress]
    mem_limit: 768m
    cpus: 0.5
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 6
    depends_on:
      api: {condition: service_healthy}

  gateway:
    <<: *app
    command: [python, -m, deployment.phase19.gateway]
    environment:
      <<: *environment
      PHASE19_ORIGIN: ${PHASE19_ORIGIN:?Set the private HTTPS origin}
    ports: ["127.0.0.1:9443:9443"]
    volumes:
      - type: bind
        source: ${PHASE19_TLS_CERT:?Supply an operator-trusted certificate}
        target: /run/secrets/tls.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PHASE19_TLS_KEY:?Supply the private TLS key}
        target: /run/secrets/tls.key
        read_only: true
        bind: {create_host_path: false}
    networks: [frontend]
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',9443),3).close()"]
      interval: 10s
      timeout: 4s
      retries: 6
    depends_on:
      ui: {condition: service_healthy}

  redis:
    image: redis:7.4-alpine
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, 192mb,
              --maxmemory-policy, noeviction, --save, "", --protected-mode, "no"]
    volumes:
      - type: bind
        source: ${PHASE19_REDIS_ROOT:?Prepare dedicated Redis directory}
        target: /data
        bind: {create_host_path: false}
    networks: [backend]
    mem_limit: 256m
    cpus: 0.5
    restart: "on-failure:3"
    stop_grace_period: 90s
    logging: *logging
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:1.5.9
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,uid=10001,gid=10001,mode=0700"]
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - type: bind
        source: ${PHASE19_CHROMA_ROOT:?Prepare dedicated Chroma directory}
        target: /data
        bind: {create_host_path: false}
    networks: [backend]
    mem_limit: 1536m
    cpus: 1.0
    restart: "on-failure:3"
    stop_grace_period: 90s
    logging: *logging
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -1 <&3 | grep -q '200'"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  backend: {internal: true}
  frontend: {internal: true}
  egress: {}
