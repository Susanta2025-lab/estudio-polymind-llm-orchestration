apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "polymind.fullname" . }}
  labels:
    {{- include "polymind.labels" . | nindent 4 }}
data:
  PYTHONPATH: /app
  API_HOST: 0.0.0.0
  API_PORT: {{ .Values.application.port | quote }}
  DEPLOYMENT_ENV: {{ .Values.application.deploymentEnv | quote }}
  INFERENCE_PROVIDER: {{ .Values.application.inferenceProvider | quote }}
  OPENAI_COMPATIBLE_BASE_URL: {{ required "application.openaiCompatibleBaseUrl is required" .Values.application.openaiCompatibleBaseUrl | quote }}
  OPENAI_COMPATIBLE_MODEL_MAP: {{ .Values.application.openaiCompatibleModelMap | quote }}
  MEMORY_PROVIDER: {{ .Values.application.memoryProvider | quote }}
  VECTOR_STORE_PROVIDER: {{ .Values.application.vectorStoreProvider | quote }}
  VECTOR_STORE_HOST: {{ required "application.vectorStoreHost is required" .Values.application.vectorStoreHost | quote }}
  VECTOR_STORE_PORT: {{ .Values.application.vectorStorePort | quote }}
  VECTOR_STORE_SSL: {{ .Values.application.vectorStoreSsl | quote }}
  VECTOR_STORE_COLLECTION: {{ .Values.application.vectorStoreCollection | quote }}
  BM25_CORPUS_VERSION: {{ required "application.bm25CorpusVersion is required" .Values.application.bm25CorpusVersion | quote }}
  PROVIDER_READINESS_TIMEOUT: {{ .Values.application.providerReadinessTimeout | quote }}
  PROVIDER_READINESS_RETRIES: {{ .Values.application.providerReadinessRetries | quote }}
  PROVIDER_READINESS_BACKOFF: {{ .Values.application.providerReadinessBackoff | quote }}
  MEMORY_CONNECT_TIMEOUT: {{ .Values.application.memoryConnectTimeout | quote }}
  MEMORY_OPERATION_TIMEOUT: {{ .Values.application.memoryOperationTimeout | quote }}
  VECTOR_STORE_TIMEOUT: {{ .Values.application.vectorStoreTimeout | quote }}
  API_AUTH_ENABLED: {{ .Values.application.authEnabled | quote }}
  API_DOCS_ENABLED: {{ .Values.application.docsEnabled | quote }}
  MAX_REQUEST_BYTES: {{ .Values.application.maxRequestBytes | quote }}
