{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "polymind.fullname" . }}
  labels:
    {{- include "polymind.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.redisUrlKey }}: {{ required "secrets.values.redisUrl is required when secrets.create=true" .Values.secrets.values.redisUrl | quote }}
  {{- with .Values.secrets.values.openaiCompatibleApiKey }}
  {{ $.Values.secrets.openaiCompatibleApiKeyKey }}: {{ . | quote }}
  {{- end }}
{{- end }}

