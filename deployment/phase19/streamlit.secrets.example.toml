# INERT field inventory, never mount this file or name it secrets.toml in source.
# Populate a separate private /etc/polymind/secrets/streamlit.toml only after review.
# The callback must equal PHASE19_ORIGIN + "/oauth2callback" and the Entra Web URI.
# Placeholder identifiers/credentials are not verified operational configuration.
[auth]
redirect_uri = "https://polymind.test:9443/oauth2callback"
server_metadata_url = "https://login.microsoftonline.com/<TENANT_UUID>/v2.0/.well-known/openid-configuration"
client_id = "<STREAMLIT_BROWSER_CLIENT_UUID>"
client_secret = "<SUPPLIED_PRIVATELY_BY_CUSTODIAN>"
cookie_secret = "<SUPPLIED_PRIVATELY_BY_CUSTODIAN>"
expose_tokens = ["access"]

[auth.client_kwargs]
scope = "openid api://<API_CLIENT_UUID>/access_as_user"
