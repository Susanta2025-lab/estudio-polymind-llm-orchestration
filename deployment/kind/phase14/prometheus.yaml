apiVersion: v1
kind: ServiceAccount
metadata:
  name: phase14-prometheus
  namespace: polymind-phase10
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: phase14-prometheus-discovery
  namespace: polymind-phase10
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: phase14-prometheus-discovery
  namespace: polymind-phase10
subjects:
  - kind: ServiceAccount
    name: phase14-prometheus
    namespace: polymind-phase10
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: phase14-prometheus-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phase14-prometheus
  namespace: polymind-phase10
  labels:
    app.kubernetes.io/name: phase14-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: phase14-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phase14-prometheus
    spec:
      serviceAccountName: phase14-prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.5
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: phase14-prometheus-config
        - name: rules
          configMap:
            name: phase14-prometheus-rules
        - name: data
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: phase14-prometheus
  namespace: polymind-phase10
spec:
  selector:
    app.kubernetes.io/name: phase14-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
