services:

  api:
    build: .

    working_dir: /app

    container_name: polymind-api

    environment:

      PYTHONPATH: /app

      API_HOST: 0.0.0.0

      API_PORT: 8001

      DEPLOYMENT_ENV: compose

      INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-ollama}

      OLLAMA_URL: http://host.docker.internal:11434/api/chat

      # Optional pass-through settings for an external OpenAI-compatible server.
      # Leave unset while using Ollama; configure them in the host environment
      # when INFERENCE_PROVIDER=openai_compatible.
      OPENAI_COMPATIBLE_BASE_URL:
      OPENAI_COMPATIBLE_API_KEY:
      OPENAI_COMPATIBLE_CONNECT_TIMEOUT:
      OPENAI_COMPATIBLE_READ_TIMEOUT:
      OPENAI_COMPATIBLE_MODEL_MAP:
      OPENAI_COMPATIBLE_GENERATION_PARAMETERS:

      MEMORY_PROVIDER: ${MEMORY_PROVIDER:-file}
      MEMORY_FILE: ${MEMORY_FILE:-memory/chat_history.json}
      MEMORY_HISTORY: ${MEMORY_HISTORY:-6}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MEMORY_CONNECT_TIMEOUT: ${MEMORY_CONNECT_TIMEOUT:-2}
      MEMORY_OPERATION_TIMEOUT: ${MEMORY_OPERATION_TIMEOUT:-2}
      MEMORY_TTL: ${MEMORY_TTL:-0}

      VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-chroma_local}
      CHROMA_PATH: ${CHROMA_PATH:-./chroma_db}
      VECTOR_STORE_HOST: ${VECTOR_STORE_HOST:-chroma}
      VECTOR_STORE_PORT: ${VECTOR_STORE_PORT:-8000}
      VECTOR_STORE_SSL: ${VECTOR_STORE_SSL:-false}
      VECTOR_STORE_COLLECTION: ${VECTOR_STORE_COLLECTION:-knowledge_base}
      VECTOR_STORE_TIMEOUT: ${VECTOR_STORE_TIMEOUT:-5}
      BM25_CORPUS_VERSION: ${BM25_CORPUS_VERSION:-development}

    ports:
      - "8001:8001"

    volumes:
      - ./data/docs:/app/data/docs
      - ./chroma_db:/app/chroma_db
      - ./memory:/app/memory

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-memory:/data
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    profiles: ["vector"]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - chroma-data:/data
    restart: unless-stopped

  ui:
    build: .
    working_dir: /app
    container_name: polymind-ui

    environment:
      - PYTHONPATH=/app

      # IMPORTANT: UI must talk to API container, not localhost
      - API_URL=http://api:8001/query
      - STREAM_URL=http://api:8001/query/stream

    command: >
      streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501

    ports:
      - "8501:8501"

    depends_on:
      - api

    restart: unless-stopped

volumes:
  redis-memory:
  chroma-data:
